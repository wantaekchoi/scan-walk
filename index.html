<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- the scan never leaves the page: no fetch/XHR/WebSocket/beacon, images only from here or the file itself -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; img-src 'self' blob: data:">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="scan-walk">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>scan-walk</title>
<style>
  :root { color-scheme: dark; font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111; color: #eee; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  button { font: inherit; color: inherit; background: rgba(30, 30, 30, .72); border: 1px solid rgba(255, 255, 255, .18); border-radius: 10px; padding: 8px 11px; touch-action: none; cursor: pointer; }
  button[aria-pressed="true"] { background: rgba(240, 240, 240, .9); color: #111; }
  #bar { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); left: max(10px, env(safe-area-inset-left)); display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; pointer-events: none; }
  #bar button { pointer-events: auto; }
  .stick { position: fixed; left: 0; top: 0; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .5); background: rgba(255, 255, 255, .08); pointer-events: none; display: none; opacity: .8; }
  .stick div { position: absolute; left: 32px; top: 32px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .6); }
  .stick::after { content: attr(data-label); position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 6px; font-size: 13px; white-space: nowrap; }
  .stick.on { display: block; }
  .stick.on::after { display: none; }
  /* resting spots: the stick appears where the left thumb lands, the right thumb drags the view; these only show which side does what */
  @media (pointer: coarse) {
    .stick { display: block; opacity: .4; }
    #stick { transform: translate(calc(env(safe-area-inset-left) + 92px), calc(100dvh - env(safe-area-inset-bottom) - 110px)); }
    #look { transform: translate(calc(100vw - env(safe-area-inset-right) - 92px), calc(100dvh - env(safe-area-inset-bottom) - 110px)); }
    .stick.on { opacity: .8; }
  }
  #cross { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: rgba(255, 255, 255, .6); pointer-events: none; }
  #intro, #busy { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(17, 17, 17, .92); }
  #intro[hidden], #busy[hidden] { display: none; }
  #intro h1 { margin: 0; font-size: 22px; font-weight: 600; }
  #intro p { margin: 0; max-width: 30em; color: #aaa; word-break: keep-all; }
  #intro-open { padding: 14px 28px; font-size: 18px; }
  #intro #msg { color: #f99; }
  #toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100% - 32px); padding: 10px 14px; border-radius: 10px; background: rgba(60, 20, 20, .9); color: #fdd; pointer-events: none; }
  #busy .spin { width: 34px; height: 34px; border: 3px solid rgba(255, 255, 255, .2); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/build/index.module.js"
  },
  "integrity": {
    "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js": "sha384-m8JoFX52V6NGv2usipnlLJKnJfL7IE8dbniPDDCSGSQv3Hm4n6PjfV6syVwfuoRc",
    "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "sha384-mdKeCwPEcbDvzaxwhm+MVuLoMou+E7jQqrs4tmu/n8HBYPGI1kZt0MkJxlMR4zFM",
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/loaders/USDLoader.js": "sha384-vb6C/CawIvaplMz2OmvP4v9c/Nl6UI34i+g7lhNJ9UzZ6eJ1qK9F1NM4rXKx1rFG",
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/loaders/usd/USDAParser.js": "sha384-e6733k5TMrckgvAJsa1Q2gWVcfLBAs/eXUAViBZD1bKmn+R801vNmC19bJwMOROS",
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/loaders/usd/USDCParser.js": "sha384-jtNzQ/A2LAXMgcV+53Fk4i62KvSbeSm2ffu/9TgZEhMo+4VnXWecGdlMVj1IcBGM",
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/loaders/usd/USDComposer.js": "sha384-Gfig92tDYhqYeB6ywjxicuNEg2uS9Im7uTZKs2LkmMz0fW77jVFCIi7LTi10wNx9",
    "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/libs/fflate.module.js": "sha384-WfAf3P1ihuiJhAj/FmfdKxOqoKSzTJ1JQEyTB4vuhzg+4QYUKf4Abi6Bijn0sbr6",
    "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/build/index.module.js": "sha384-G+hx/I3hYul0/37Q6Ntxn6TLNj8y1E2PC5g4dmBSi2kgY7LjfhT987Xcz+7j2Hb3"
  }
}
</script>
<script type="module" src="main.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="cross"></div>
<div id="stick" class="stick" data-label="이동"><div></div></div>
<div id="look" class="stick" data-label="시점"><div></div></div>
<div id="bar">
  <button id="open">열기</button>
  <button id="mode">걷기</button>
  <button id="light" aria-pressed="false">조명</button>
  <button id="axis">축 +Y</button>
  <button id="scale">×1</button>
  <button id="reset">처음</button>
  <button id="forget" hidden>잊기</button>
</div>
<div id="intro">
  <h1>scan-walk</h1>
  <p>3D Scanner App 에서 내보낸 USDZ 를 열어 걸어 다닙니다. 파일은 이 기기 밖으로 나가지 않습니다.</p>
  <button id="intro-open">USDZ 열기</button>
  <p>폰: 왼쪽 엄지로 이동, 오른쪽 엄지로 드래그해 시점. 보는 방향으로 나아갑니다. 바닥 두 번 탭으로 순간이동.<br>
     PC: 파일을 끌어다 놓기. 클릭 후 마우스로 시점, WASD 로 보는 방향 이동, Space/E 위로, Shift/Q 아래로, 더블클릭 순간이동.<br>
     날면서 시작합니다. 날 때는 벽도 바닥도 지나가고, 걷기 버튼을 누르면 벽에 막히며 걷습니다.</p>
  <p id="msg"></p>
  <p id="again" hidden><button id="reopen">다시 열기</button> <button id="again-forget">잊기</button></p>
</div>
<div id="toast" hidden></div>
<div id="busy" hidden><div class="spin"></div><div id="busy-text"></div></div>
<!-- no accept filter: iOS greys out .usdz with some accept values -->
<input type="file" id="file" hidden>
</body>
</html>
